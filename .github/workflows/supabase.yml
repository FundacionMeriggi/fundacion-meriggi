name: Actualizar base de datos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vincular proyecto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Aplicar migraciones
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Configurar secretos obligatorios
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APP_URL: https://fundacionmeriggi.github.io/fundacion-meriggi
          BOOTSTRAP_SECRET: ${{ secrets.BOOTSTRAP_SECRET }}
          REMINDER_WEBHOOK_SECRET: ${{ secrets.REMINDER_WEBHOOK_SECRET }}
        run: supabase secrets set APP_URL="$APP_URL" BOOTSTRAP_SECRET="$BOOTSTRAP_SECRET" REMINDER_WEBHOOK_SECRET="$REMINDER_WEBHOOK_SECRET"
    
      - name: Publicar funciones
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy resolve-login --no-verify-jwt
          supabase functions deploy activate-invitation --no-verify-jwt
          supabase functions deploy create-invitation
          supabase functions deploy send-communication
          supabase functions deploy send-reminders --no-verify-jwt
